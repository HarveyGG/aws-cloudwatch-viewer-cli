name: Release cwlogs via tag

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  update-tap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v3

      - name: Set up Git
        run: |
          git config --global user.name "release-bot"
          git config --global user.email "release-bot@example.com"

      - name: Install dependencies
        run: sudo apt update && sudo apt install -y curl

      - name: Generate Formula and Push
        env:
          TAG: ${{ github.ref_name }}
          TAP_REPO: HarveyGG/homebrew-cwlogs
          TAP_BRANCH: brew-release
          GITHUB_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          echo "📦 Using tag: $TAG"
          TAR_URL="https://github.com/HarveyGG/aws-cloudwatch-viewer-cli/archive/refs/tags/$TAG.tar.gz"
          curl -LO "$TAR_URL"
          SHA=$(shasum -a 256 "$TAG.tar.gz" | awk '{print $1}')
          
          git clone --branch "$TAP_BRANCH" https://$GITHUB_ACTOR:$GITHUB_TOKEN@github.com/$TAP_REPO.git tap
          cd tap

          mkdir -p Formula
          echo "class Cwlogs < Formula" > Formula/cwlogs.rb
          echo "  desc \"AWS CloudWatch Log Viewer with HTML output, alias & highlight support\"" >> Formula/cwlogs.rb
          echo "  homepage \"https://github.com/HarveyGG/aws-cloudwatch-viewer-cli\"" >> Formula/cwlogs.rb
          echo "  url \"$TAR_URL\"" >> Formula/cwlogs.rb
          echo "  sha256 \"$SHA\"" >> Formula/cwlogs.rb
          echo "  version \"${TAG#v}\"" >> Formula/cwlogs.rb
          echo "" >> Formula/cwlogs.rb
          echo "  def install" >> Formula/cwlogs.rb
          echo "    bin.install \"bin/cwlogs\"" >> Formula/cwlogs.rb
          echo "    bin.install \"bin/cwlogs_real.sh\"" >> Formula/cwlogs.rb
          echo "  end" >> Formula/cwlogs.rb
          echo "end" >> Formula/cwlogs.rb

          git add Formula/cwlogs.rb
          git commit -m "Update cwlogs formula to $TAG"
          git push origin "$TAP_BRANCH"
