name: Release cwlogs via tag

on:
  push:
    tags:
      - 'v*.*.*'  # 例如 v0.4.0、v1.0.0

jobs:
  update-tap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v3

      - name: Set up Git
        run: |
          git config --global user.email "release-bot@github.com"
          git config --global user.name "release-bot"

      - name: Install dependencies
        run: sudo apt update && sudo apt install -y curl

      - name: Generate Formula and Push
        env:
          TAG: ${{ github.ref_name }}
          TAP_REPO: HarveyGG/homebrew-cwlogs
          GITHUB_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          echo "🔧 Using tag: $TAG"
          TAR_URL="https://github.com/HarveyGG/aws-cloudwatch-viewer-cli/archive/refs/tags/$TAG.tar.gz"
          curl -LO "$TAR_URL"
          SHA=$(shasum -a 256 "$TAG.tar.gz" | awk '{print $1}')

          # Clone tap repo
          git clone https://$GITHUB_ACTOR:$GITHUB_TOKEN@github.com/$TAP_REPO.git tap
          cd tap

          mkdir -p Formula
          cat <<'EOF'> Formula/cwlogs.rb
class Cwlogs < Formula
  desc "AWS CloudWatch Log Viewer with HTML output, alias & highlight support"
  homepage "https://github.com/HarveyGG/aws-cloudwatch-viewer-cli"
  url "$TAR_URL"
  sha256 "$SHA"
  version "${TAG#v}"

  def install
    bin.install "bin/cwlogs"
    bin.install "bin/cwlogs_real.sh"
  end
end
EOF


          git add Formula/cwlogs.rb
          git commit -m "Update cwlogs formula to $TAG"
          git push origin main
